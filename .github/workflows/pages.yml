name: Check and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/browser-video-generator]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check app and prepare static site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JavaScript and core behavior
        run: |
          for file in js/*.js; do node --check "$file"; done
          node --test tests/*.test.cjs
      - name: Install browser test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Select browser available on runner
        run: |
          shorts_browser="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$shorts_browser" ]; then
            printf 'CHROMIUM_PATH=%s\n' "$shorts_browser" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
          fi
      - name: Check editor functionality
        run: python tests/browser.py
      - name: Check real browser video and audio recording
        run: |
          if ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          python tests/video-browser.py
          python tests/media-browser.py
      - name: Prepare Pages files and downloads
        run: python scripts/prepare-site.py
      - name: Check deployment under repository path
        run: python tests/pages.py
      - name: Upload static site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
