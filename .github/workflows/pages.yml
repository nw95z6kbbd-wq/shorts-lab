name: Check Shorts Studio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/browser-video-generator]
  workflow_dispatch:
  workflow_call:
    inputs:
      upload_pages:
        description: Prepare a Pages artifact only for an explicitly approved publication run
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check app and prepare static site
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JavaScript and core behavior
        run: |
          for file in js/*.js; do node --check "$file"; done
          node --test tests/*.test.cjs
          python tests/render_guard.py
          python tests/safari-baseline-test.py
          node scripts/release.cjs check
      - name: Install browser test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Select browser available on runner
        run: |
          shorts_browser="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$shorts_browser" ]; then
            printf 'CHROMIUM_PATH=%s\n' "$shorts_browser" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
          fi
      - name: Check editor functionality
        run: |
          python tests/check-errors.py tests/studio-data-browser.py
          python tests/check-errors.py tests/studio-ui-browser.py
          python tests/check-errors.py tests/project-db-browser.py
          python tests/check-errors.py tests/project-migration-browser.py
          python tests/check-errors.py tests/browser.py
      - name: Ensure FFmpeg is available
        run: |
          if ! command -v ffprobe >/dev/null; then
            printf '%s\n' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' 'Acquire::Retries "1";' | sudo tee /etc/apt/apt.conf.d/99-shortsstudio-ci-timeouts >/dev/null
            # FFmpeg needs only Ubuntu's own repositories; unrelated vendor
            # indexes on hosted runners must not hold up the browser checks.
            printf '%s\n' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble main universe' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble-updates main universe' 'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://security.ubuntu.com/ubuntu noble-security main universe' > /tmp/shorts-studio-ubuntu.list
            shorts_apt_status=0
            timeout 3m sudo apt-get -o Dir::Etc::sourcelist=/tmp/shorts-studio-ubuntu.list -o Dir::Etc::sourceparts=- update > /tmp/shorts-studio-apt.log 2>&1 || shorts_apt_status=$?
            if [ "$shorts_apt_status" -eq 0 ]; then
              timeout 3m sudo apt-get -o Dir::Etc::sourcelist=/tmp/shorts-studio-ubuntu.list -o Dir::Etc::sourceparts=- install -y ffmpeg >> /tmp/shorts-studio-apt.log 2>&1 || shorts_apt_status=$?
            fi
            if [ "$shorts_apt_status" -ne 0 ]; then
              python -c 'from pathlib import Path; text="\n".join(Path("/tmp/shorts-studio-apt.log").read_text().splitlines()[-18:]); print("::error title=FFmpeg installation::"+text.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
              exit "$shorts_apt_status"
            fi
          fi
      - name: Check shared RenderPlan against frozen renderer
        run: python tests/check-errors.py tests/render-plan-browser.py
      - name: Check real browser video and audio recording
        run: python tests/check-errors.py tests/video-browser.py
      - name: Check images and two-track video export
        run: python tests/check-errors.py tests/media-browser.py
      - name: Check project restart and restored video export
        run: python tests/check-errors.py tests/project-browser.py
      - name: Prepare Pages files and downloads
        run: python scripts/prepare-site.py
      - name: Check offline standalone RenderPlan
        run: RENDER_ENTRY=downloads/Shorts-Studio.html python tests/check-errors.py tests/render-plan-browser.py
      - name: Check product information and standalone version
        run: |
          python tests/check-errors.py tests/product-browser.py
          python tests/check-errors.py tests/ux-browser.py
          PRODUCT_ENTRY=downloads/Shorts-Studio.html python tests/check-errors.py tests/product-browser.py
          UX_ENTRY=downloads/Shorts-Studio.html python tests/check-errors.py tests/ux-browser.py
          PERSISTENCE_ENTRY=downloads/Shorts-Studio.html python tests/check-errors.py tests/project-browser.py
          STUDIO_ENTRY=downloads/Shorts-Studio.html python tests/check-errors.py tests/studio-ui-browser.py
      - name: Check portable ZIP backups and restored video
        run: |
          python tests/check-errors.py tests/backup-browser.py
          BACKUP_ENTRY=downloads/Shorts-Studio.html python tests/check-errors.py tests/backup-browser.py
      - name: Check deployment under repository path
        run: python tests/pages.py
      # A normal push/PR/manual check never uploads a deployable Pages artifact.
      - name: Validate publication request before artifact upload
        if: inputs.upload_pages == true
        run: node scripts/pages-publication.cjs
      - name: Upload static site for explicit publication
        if: inputs.upload_pages == true
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  webkit:
    name: Product UI in WebKit and mobile emulation
    runs-on: ubuntu-24.04
    # Allow cold registry pulls without spending every run resolving apt deps.
    timeout-minutes: 20
    container:
      # Keep the tag aligned with requirements-dev.txt; the preflight checks it.
      # Official multi-arch manifest digest verified against MCR, not a mutable tag.
      image: mcr.microsoft.com/playwright/python:v1.62.0-noble@sha256:aa81288e738725378becba5b3e06cb0f3a7f012a610e87e8d767a090ea3f740d
      options: --init --shm-size=1g
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Python, browsers and OS libraries are already provided by the image.
      # Its build-time Playwright wheel is intentionally removed upstream.
      - name: Install Python browser test tools
        run: python -m pip install --timeout 30 --retries 2 -r requirements-dev.txt
      - name: Verify bundled WebKit environment
        run: |
          python - <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          import re
          from playwright.sync_api import sync_playwright

          workflow = Path('.github/workflows/pages.yml').read_text()
          image = re.search(r'mcr\.microsoft\.com/playwright/python:v([0-9.]+)-noble@sha256:', workflow)
          if not image or image.group(1) != version('playwright'):
              raise RuntimeError('Playwright image and requirements-dev.txt must use the same version; update the tag AND verified digest together.')
          with sync_playwright() as p:
              executable = Path(p.webkit.executable_path)
              if not executable.is_file():
                  raise RuntimeError('Matching bundled WebKit not found: ' + str(executable))
              browser = p.webkit.launch()
              page = browser.new_page()
              page.set_content('<p lang="ru">WebKit готов</p>')
              assert page.locator('p').inner_text() == 'WebKit готов'
              browser.close()
              print('Bundled WebKit launched successfully; Playwright ' + version('playwright'))
          PY
      - name: Prepare WebKit static files
        run: python scripts/prepare-site.py
      - name: Check shared RenderPlan and offline standalone in WebKit
        run: |
          RENDER_BROWSER=webkit python tests/check-errors.py tests/render-plan-browser.py
          RENDER_BROWSER=webkit RENDER_ENTRY=downloads/Shorts-Studio.html python tests/check-errors.py tests/render-plan-browser.py
      - name: Check portable ZIP backups in WebKit
        timeout-minutes: 3
        run: |
          BACKUP_BROWSER=webkit python tests/check-errors.py tests/backup-browser.py
      - name: Check standalone ZIP backups in WebKit
        timeout-minutes: 3
        run: |
          BACKUP_BROWSER=webkit BACKUP_ENTRY=downloads/Shorts-Studio.html python tests/check-errors.py tests/backup-browser.py
      - name: Check source product UI in WebKit
        timeout-minutes: 4
        run: |
          PRODUCT_BROWSER=webkit python tests/check-errors.py tests/product-browser.py
          UX_BROWSER=webkit python tests/check-errors.py tests/ux-browser.py
      - name: Check standalone product UI in WebKit
        timeout-minutes: 4
        run: |
          PRODUCT_BROWSER=webkit PRODUCT_ENTRY=downloads/Shorts-Studio.html python tests/check-errors.py tests/product-browser.py
          UX_BROWSER=webkit UX_ENTRY=downloads/Shorts-Studio.html python tests/check-errors.py tests/ux-browser.py
      - name: Check IndexedDB and migration in WebKit
        timeout-minutes: 3
        run: |
          PERSISTENCE_BROWSER=webkit python tests/check-errors.py tests/studio-data-browser.py
          PERSISTENCE_BROWSER=webkit python tests/check-errors.py tests/studio-ui-browser.py
          PERSISTENCE_BROWSER=webkit STUDIO_ENTRY=downloads/Shorts-Studio.html python tests/check-errors.py tests/studio-ui-browser.py
          PERSISTENCE_BROWSER=webkit python tests/check-errors.py tests/project-db-browser.py
          PERSISTENCE_BROWSER=webkit python tests/check-errors.py tests/project-migration-browser.py
      - name: Check project restart in WebKit
        timeout-minutes: 3
        run: |
          PERSISTENCE_BROWSER=webkit python tests/check-errors.py tests/project-browser.py
          PERSISTENCE_BROWSER=webkit PERSISTENCE_ENTRY=downloads/Shorts-Studio.html python tests/check-errors.py tests/project-browser.py

  safari:
    name: Native Safari on macOS
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out stable baseline for Safari export comparison
        uses: actions/checkout@v4
        with:
          # Frozen before the approved RenderPlan/resource bridge (PR #11).
          # A PR base or push SHA moves past that bridge after a merge.
          ref: ad1ca0a701605af6d80c8de8983ec5ebeb9e8905
          path: .safari-baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify pinned Safari baseline and source guard
        run: python tests/safari-baseline-test.py --baseline .safari-baseline
      - name: Enable Safari WebDriver
        run: sudo /usr/bin/safaridriver --enable
      - name: Check product UI and video smoke test in real Safari
        env:
          SAFARI_BASELINE_ROOT: .safari-baseline
        run: python tests/safari-product.py
