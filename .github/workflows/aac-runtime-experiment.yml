name: Experiment runtime AAC calibration
on:
  push:
    branches: [feat/editor-export-foundation]
    paths:
      - .github/workflows/aac-runtime-experiment.yml
      - tests/aac-runtime-*
      - tests/aac_completion_analysis.py
      - tests/aac-completion-mux.cjs
      - tests/fixtures/aac-completion/**
      - tests/fixtures/aac-runtime/**
      - tests/safari-aac-probe.js
      - tests/safari_aac_analysis.py
      - tests/requirements-safari-aac.txt
      - requirements-dev.txt
      - js/native-mp4.js
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aac-runtime-${{ github.ref }}
  cancel-in-progress: false
jobs:
  webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright/python:v1.62.0-noble@sha256:aa81288e738725378becba5b3e06cb0f3a7f012a610e87e8d767a090ea3f740d
      options: --init --shm-size=1g
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      AAC_RUNTIME_MODE: webkit
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Trust only this container checkout for diagnostic Git reads
        id: checkout-trust
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated analysis tools
        run: |
          python -m pip install --timeout 30 --retries 2 -r requirements-dev.txt -r tests/requirements-safari-aac.txt
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            timeout 3m apt-get update
            timeout 3m apt-get install -y ffmpeg
          fi
      - name: Check candidate and rejection oracles
        run: |
          node --test tests/aac-runtime-probe.test.cjs
          python tests/aac-runtime-test.py
      - name: Measure real WebKit and independently decode raw AAC and MP4
        run: timeout 8m python tests/aac-runtime-experiment.py
      - name: Retain preparation failure evidence when no summary exists
        id: preparation-evidence
        if: always()
        run: |
          if [ ! -f test-results/aac-runtime-webkit/summary.json ]; then
            mkdir -p test-results/aac-runtime-webkit
            printf '%s\n' '{"schema":1,"mode":"webkit","status":"incomplete","stage":"ci-before-summary","productionEnabled":false}' > test-results/aac-runtime-webkit/preparation.json
          fi
      - name: Preserve synthetic evidence even on refusal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aac-runtime-webkit-${{ github.sha }}
          path: test-results/aac-runtime-webkit/
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: false
  safari:
    runs-on: macos-15-intel
    timeout-minutes: 15
    env:
      AAC_RUNTIME_MODE: native-safari
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated analysis tools
        run: |
          python -m pip install -r tests/requirements-safari-aac.txt
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            brew install ffmpeg
          fi
      - name: Check candidate and rejection oracles
        run: |
          node --test tests/aac-runtime-probe.test.cjs
          python tests/aac-runtime-test.py
      - name: Enable real Safari WebDriver
        run: sudo /usr/bin/safaridriver --enable
      - name: Measure native Safari and independently decode raw AAC and MP4
        run: python tests/aac-runtime-experiment.py
      - name: Retain preparation failure evidence when no summary exists
        id: preparation-evidence
        if: always()
        run: |
          if [ ! -f test-results/aac-runtime-native-safari/summary.json ]; then
            mkdir -p test-results/aac-runtime-native-safari
            printf '%s\n' '{"schema":1,"mode":"native-safari","status":"incomplete","stage":"ci-before-summary","productionEnabled":false}' > test-results/aac-runtime-native-safari/preparation.json
          fi
      - name: Preserve synthetic evidence even on refusal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aac-runtime-safari-${{ github.sha }}
          path: test-results/aac-runtime-native-safari/
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: false
