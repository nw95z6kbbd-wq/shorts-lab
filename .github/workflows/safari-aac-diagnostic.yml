name: Diagnose native Safari AAC timing

on:
  push:
    branches: [feat/editor-export-foundation]
    paths:
      - .github/workflows/safari-aac-diagnostic.yml
      - tests/safari-aac-*
      - tests/safari_aac_analysis.py
      - tests/requirements-safari-aac.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safari-aac-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis tools
        run: |
          python -m pip install -r tests/requirements-safari-aac.txt
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            brew install ffmpeg
          fi
      - name: Test diagnostic signal analysis
        run: |
          node --test tests/safari-aac-probe.test.cjs
          python tests/safari-aac-diagnostic-test.py
      - name: Enable real Safari WebDriver
        run: sudo /usr/bin/safaridriver --enable
      - name: Capture and independently analyze synthetic AAC
        env:
          DIAGNOSTIC_COMMIT_SHA: ${{ github.sha }}
        run: python tests/safari-aac-diagnostic.py
      - name: Preserve only synthetic diagnostic artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: safari-aac-${{ github.sha }}
          path: test-results/safari-aac/
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: false
